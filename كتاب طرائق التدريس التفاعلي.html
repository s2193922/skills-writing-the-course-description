<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>كتاب طرائق التدريس التفاعلي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: an open book lying on a sage desk; right page first (Arabic binding), pages turn over the spine. */
:root{
  --desk:#DCE7E2; --desk2:#C9D9D2; --paper:#FCFCF7; --paper2:#F1F2EA; --edge:#D8DACD;
  --ink:#1C2B33; --muted:#5C6E70; --line:#DCE3DF;
  --teal:#0B6E6E; --teal-soft:#E1F1EE; --gold:#B08515; --gold-soft:#FBF1D2;
  --coral:#CF4B26; --coral-soft:#FBE4DB; --navy:#1F3A5F; --navy-soft:#E3E9F3;
  --ok:#1E8A4C; --ok-soft:#DDF3E5; --bad:#C23B2E; --bad-soft:#FBE1DE;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
  --f-quran:'Amiri','Traditional Arabic',serif;
  --shadow:0 30px 60px -20px rgba(20,40,40,.45);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0D1416; --desk2:#152024; --paper:#182326; --paper2:#1E2B2F; --edge:#2A393D;
  --ink:#E5EEEC; --muted:#9DB2AF; --line:#2C3C40;
  --teal:#43B9AE; --teal-soft:#183A39; --gold:#E2BC4E; --gold-soft:#3A3219;
  --coral:#F07D57; --coral-soft:#3D2620; --navy:#9BBAE6; --navy-soft:#1E2B3D;
  --ok:#4CC27F; --ok-soft:#173526; --bad:#F06B5E; --bad-soft:#3B1E1B;
  --shadow:0 30px 60px -20px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0D1416; --desk2:#152024; --paper:#182326; --paper2:#1E2B2F; --edge:#2A393D;
  --ink:#E5EEEC; --muted:#9DB2AF; --line:#2C3C40;
  --teal:#43B9AE; --teal-soft:#183A39; --gold:#E2BC4E; --gold-soft:#3A3219;
  --coral:#F07D57; --coral-soft:#3D2620; --navy:#9BBAE6; --navy-soft:#1E2B3D;
  --ok:#4CC27F; --ok-soft:#173526; --bad:#F06B5E; --bad-soft:#3B1E1B;
  --shadow:0 30px 60px -20px rgba(0,0,0,.7); color-scheme:dark}

html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 20%,var(--desk) 0%,var(--desk2) 100%);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;direction:rtl;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px 6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--teal);white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:12px;margin-inline-start:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
@media (max-width:560px){.top{flex-wrap:nowrap;gap:8px}.brand{font-size:14px}.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chip{flex:none}}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500}
.chip.on{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.mini{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.mini .bar{width:90px;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.mini .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s}

/* book */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:2600px;padding-block:4px}
.book{position:relative;width:min(1180px,100%);height:100%;max-height:820px;transform:rotateX(4deg);transform-style:preserve-3d}
.spread{position:relative;height:100%;display:flex;border-radius:6px;box-shadow:var(--shadow)}
.spread::before{content:"";position:absolute;inset:-9px -9px -12px -9px;border-radius:10px;background:var(--navy);z-index:-1;box-shadow:0 3px 0 var(--edge) inset}
.slot{position:relative;flex:1 1 50%;min-width:0;background:var(--paper);overflow:hidden}
.slot.r{border-radius:6px 2px 2px 6px;box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.18), -3px 0 0 var(--edge), -5px 0 0 var(--paper2), -7px 0 0 var(--edge)}
.slot.l{border-radius:2px 6px 6px 2px;box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.18), 3px 0 0 var(--edge), 5px 0 0 var(--paper2), 7px 0 0 var(--edge)}
.single .slot.r{border-radius:6px;box-shadow:inset -14px 0 18px -14px rgba(0,0,0,.18),3px 0 0 var(--edge),5px 0 0 var(--paper2),7px 0 0 var(--edge)}
.single .slot.l{display:none}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:26px 30px 44px;scrollbar-width:thin}
.folio{position:absolute;bottom:0;inset-inline:0;padding:14px 0 6px;text-align:center;font-size:12px;color:var(--muted);font-family:var(--f-display);pointer-events:none;background:linear-gradient(transparent,var(--paper) 55%)}
.slot.blank .page{background:repeating-linear-gradient(0deg,transparent 0 31px,var(--line) 31px 32px)}
.leaf{position:absolute;top:0;bottom:0;width:50%;transform-style:preserve-3d;z-index:20}
.single .leaf{width:100%}
.face{position:absolute;inset:0;background:var(--paper);overflow:hidden;border-radius:4px}
.face.back{transform:scaleX(-1)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.10),transparent 35%,transparent 70%,rgba(0,0,0,.08))}

/* bottom nav */
.nav{display:flex;align-items:center;justify-content:center;gap:14px;padding-block:8px 10px}
.nav button{border:0;background:var(--navy);color:var(--paper);border-radius:999px;padding:6px 18px;font-weight:700}
.nav button:disabled{opacity:.35;cursor:default}
.nav .where{font-size:13px;color:var(--muted);min-width:120px;text-align:center}

/* page typography */
.eyebrow{font-family:var(--f-display);color:var(--gold);font-size:13px;letter-spacing:.5px}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:30px;color:var(--teal)}
h2{font-size:22px;color:var(--teal);margin-block:4px 10px}
h3{font-size:16px;color:var(--navy);margin-block:14px 6px}
p{margin:0 0 10px}
.page ul,.page ol{margin:0 0 10px;padding-inline-start:20px}
.page li{margin-bottom:4px}
.quran{font-family:var(--f-quran);font-size:20px;color:var(--navy);line-height:1.9}
.src{font-size:12px;color:var(--muted)}
.box{border-radius:10px;padding:10px 14px;margin-block:10px;border-inline-start:5px solid var(--teal);background:var(--teal-soft)}
.box b.k{display:block;font-family:var(--f-display);font-size:13px;color:var(--teal);margin-bottom:2px}
.box.gold{border-color:var(--gold);background:var(--gold-soft)} .box.gold b.k{color:var(--gold)}
.box.coral{border-color:var(--coral);background:var(--coral-soft)} .box.coral b.k{color:var(--coral)}
.box.navy{border-color:var(--navy);background:var(--navy-soft)} .box.navy b.k{color:var(--navy)}
.tbl{overflow-x:auto;margin-block:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--teal);color:var(--paper);font-weight:700;padding:6px 8px;text-align:start}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.card{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.card h4{margin:0 0 4px;font-family:var(--f-display);font-size:15px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--gold-soft);color:var(--gold)}
.btn{border:0;border-radius:999px;padding:7px 16px;font-weight:700;background:var(--teal);color:var(--paper)}
.btn.ghost{background:transparent;border:1.5px solid var(--teal);color:var(--teal)}
.btn.gold{background:var(--gold);color:var(--paper)}
.btn.sm{padding:3px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prompt{position:relative;background:var(--paper2);border:1.5px dashed var(--teal);border-radius:12px;padding:12px 14px 12px;font-size:13.5px;white-space:pre-wrap;line-height:1.8;max-height:300px;overflow:auto}
.copied{color:var(--ok);font-weight:700;font-size:13px}
.steps{list-style:none;padding:0!important;counter-reset:s}
.steps>li{counter-increment:s;position:relative;padding-inline-start:40px;margin-bottom:12px}
.steps>li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--paper);font-family:var(--f-display);display:grid;place-items:center;font-size:14px}
.steps>li b{color:var(--navy)}

/* title page */
.titlepg{display:flex;flex-direction:column;gap:12px;height:100%;justify-content:center;text-align:center}
.titlepg .orn{font-family:var(--f-quran);color:var(--gold);font-size:22px}
.titlepg h1{font-size:34px}
.lv{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lv span{border-radius:12px;padding:8px 14px;font-family:var(--f-display);color:var(--paper);font-size:15px}

/* dashboard */
.ring{width:110px;height:110px;flex:none}
.ms{list-style:none;padding:0!important}
.ms li{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.ms li i{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;background:var(--line);color:var(--muted)}
.ms li.done i{background:var(--ok);color:var(--paper)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{width:84px;text-align:center;font-size:12px;opacity:.35;filter:grayscale(1)}
.badge.on{opacity:1;filter:none}
.badge .md{width:54px;height:54px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:3px solid var(--gold);background:var(--gold-soft)}
.toc button{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:5px 2px;border-bottom:1px solid var(--line);text-align:start}
.toc button span:last-child{color:var(--muted);font-size:13px}

/* video */
.player{border-radius:12px;overflow:hidden;background:var(--navy);color:#fff}
.scr{position:relative;aspect-ratio:16/9;max-width:100%;background:#E9E1CF}
.scr svg{width:100%;height:100%;display:block}
.scene-t{position:absolute;top:8px;inset-inline-end:10px;background:rgba(15,30,40,.75);color:#fff;font-family:var(--f-display);font-size:13px;padding:2px 10px;border-radius:8px}
.timer{position:absolute;top:10px;inset-inline-start:12px;width:58px;height:58px}
.cap{background:#10222b;padding:10px 14px;min-height:86px;font-size:14.5px;line-height:1.7;color:#F3F6F4}
.cap .who{font-family:var(--f-display);font-size:13px;color:#F0C75E;display:block}
.ctrl{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0b1a21;flex-wrap:wrap}
.ctrl button{background:#24414c;border:0;border-radius:8px;color:#fff;padding:4px 12px;font-size:13px}
.ctrl button.play{background:#F0C75E;color:#10222b;font-weight:700}
.segs{display:flex;gap:3px;flex:1;min-width:120px}
.segs b{flex:1;height:7px;border-radius:4px;background:#2c4651;cursor:pointer}
.segs b.on{background:#F0C75E}.segs b.cur{background:#7fd3c7}
.did{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.did>div{border-radius:10px;padding:8px 10px;font-size:13.5px;min-width:0}

/* game */
.game{border-radius:14px;background:linear-gradient(160deg,var(--navy),#123d4d);color:#fff;padding:14px;min-height:380px;position:relative}
.game h3{color:#F0C75E;margin:0}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.gbar{height:7px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-block:8px}
.gbar i{display:block;height:100%;background:#F0C75E;transition:width .4s}
.gq{font-size:17px;font-weight:700;margin-block:10px;line-height:1.7}
.opts{display:grid;gap:8px}
.opt{border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:12px;padding:9px 12px;text-align:start;color:#fff;font-size:15px}
.opt:hover:not(:disabled){background:rgba(255,255,255,.16)}
.opt.ok{background:#1E8A4C;border-color:#7be3a7}.opt.no{background:#a8352a;border-color:#ffb3a8}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
.seq{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;border:2px dashed rgba(255,255,255,.3);border-radius:12px;padding:6px;margin-bottom:8px}
.seq span{background:#F0C75E;color:#10222b;border-radius:8px;padding:3px 10px;font-weight:700;font-size:14px}
.feedback{margin-top:10px;border-radius:10px;padding:8px 12px;font-size:14px;background:rgba(255,255,255,.1)}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.gbtns button{border:0;border-radius:999px;padding:5px 14px;font-weight:700;background:#F0C75E;color:#10222b}
.gbtns button.alt{background:rgba(255,255,255,.15);color:#fff}
.lvlpick{display:grid;gap:8px;margin-top:12px}
.lvlpick button{border:0;border-radius:12px;padding:10px;color:#10222b;font-weight:700;text-align:start}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:none}}

/* lab & forms */
.form{display:grid;gap:10px}
.form label{font-weight:700;font-size:13.5px;color:var(--navy);display:block;margin-bottom:3px}
select,input[type=text],input[type=url],textarea{width:100%;font:inherit;font-size:14px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills label{font-weight:500;color:var(--ink);display:flex;gap:5px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;margin:0;cursor:pointer}
.pills input{accent-color:var(--teal)}
/* quiz */
.qz{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.qz .o{display:block;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;margin-top:6px;font-size:14px}
.qz .o.ok{background:var(--ok-soft);border-color:var(--ok)}.qz .o.no{background:var(--bad-soft);border-color:var(--bad)}
.qz .fb{font-size:13px;margin-top:6px}
.score{font-family:var(--f-display);font-size:20px;color:var(--teal)}

@media (max-width:999px){
  .page{padding:20px 18px 40px}
  .book{transform:none}
}
@media (max-width:560px){
  body{font-size:14.5px}
  .grid2,.did{grid-template-columns:1fr}
  h1{font-size:25px} .titlepg h1{font-size:28px} h2{font-size:19px}
  .brand small{display:none}
  .mini{display:none}
  .chip{padding:2px 9px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><style>
*,*::before,*::after{box-sizing:border-box}
textarea{width:100%;font:inherit;font-size:14px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;resize:vertical}
/* library shelf */
.shelf{display:grid;gap:14px}
.shelf h3{margin:0 0 4px}
.spines{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:8px 6px 0;border-bottom:10px solid var(--gold);border-radius:2px;box-shadow:0 8px 0 -2px var(--edge)}
.spine{width:64px;height:178px;border:0;border-radius:4px 4px 2px 2px;color:#fff;position:relative;padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:inset -6px 0 0 rgba(0,0,0,.18),inset 4px 0 0 rgba(255,255,255,.18);transition:transform .2s}
.spine:hover:not(:disabled){transform:translateY(-8px)}
.spine .nm{writing-mode:vertical-rl;font-family:var(--f-display);font-size:15px;line-height:1.2}
.spine .pc{font-size:11px;background:rgba(0,0,0,.25);border-radius:6px;padding:0 4px}
.spine:disabled{opacity:.38;cursor:default;filter:saturate(.5)}
.spine.cur{outline:3px solid var(--gold);outline-offset:2px}
.legend{font-size:12.5px;color:var(--muted)}
/* discussion board */
.dboard{border-radius:14px;background:var(--paper2);border:1.5px solid var(--line);padding:10px}
.dtopic{background:var(--coral);color:#fff;border-radius:10px;padding:8px 12px;font-family:var(--f-display);font-size:16px}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dcol{min-width:0;background:var(--paper);border-radius:10px;padding:6px;border-top:5px solid var(--c)}
.dcol h5{margin:0 0 4px;font-family:var(--f-display);font-size:13.5px;color:var(--c)}
.note{background:var(--gold-soft);border-radius:8px;padding:5px 8px;margin-bottom:5px;font-size:13px;display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.note button{border:0;background:var(--paper);border-radius:999px;font-size:12px;padding:0 8px;flex:none}
.dadd{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dadd select{width:auto;flex:none}.dadd input{flex:1;min-width:140px}
/* story flipbook */
.sbook{border-radius:14px;overflow:hidden;background:#13232a;color:#F3F6F4}
.sbook .art{aspect-ratio:16/9;max-width:100%;background:#20343c}
.sbook .art svg{width:100%;height:100%;display:block}
.sbook .txt{padding:10px 14px;font-size:15px;line-height:1.8;min-height:96px}
.sbook .bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#0c191e;flex-wrap:wrap}
.sbook .bar button{border:0;border-radius:8px;padding:4px 12px;background:#24414c;color:#fff;font-size:13px}
.sbook .bar .dots{display:flex;gap:4px;flex:1}
.sbook .bar .dots i{flex:1;height:6px;border-radius:4px;background:#2c4651}
.sbook .bar .dots i.on{background:#F0C75E}
.sbook .ask{display:grid;gap:6px;margin-top:8px}
.sbook .ask button{border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);color:#fff;border-radius:10px;padding:6px 10px;text-align:start;font-size:14px}
.sbook .ask button.ok{background:#1E8A4C}.sbook .ask button.no{background:#a8352a}
/* skill simulator */
.sim{border-radius:14px;border:1.5px solid var(--line);padding:10px;background:var(--paper2)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{border:1.5px solid var(--navy);background:transparent;color:var(--navy);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.tabs button.on{background:var(--navy);color:var(--paper)}
.slots{display:grid;gap:5px;counter-reset:k;margin-bottom:8px}
.slots div{counter-increment:k;border:1.5px dashed var(--line);border-radius:10px;padding:5px 10px;min-height:34px;font-size:14px;display:flex;gap:8px;align-items:center}
.slots div::before{content:counter(k);width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.slots div.fill{border-style:solid;border-color:var(--teal);background:var(--teal-soft)}
.slots div.ok{border-color:var(--ok);background:var(--ok-soft)}.slots div.no{border-color:var(--bad);background:var(--bad-soft)}
.cards{display:flex;flex-wrap:wrap;gap:6px}

<script>
/* ===== core helpers shared by every method ===== */
window.BK=(function(){
 const KEY='tq_book_v2';
 let S={m:{}};
 try{const s=localStorage.getItem(KEY);if(s)S=Object.assign(S,JSON.parse(s));}catch(e){}
 try{const o=localStorage.getItem('tq_pilot_v1');if(o&&!S.m.questions){const p=JSON.parse(o);S.m.questions={visited:[],video:!!p.video,sample:p.game||0,prompt:!!(p.prompt||p.lab),quiz:p.quiz,task:p.task||'',note:p.note||''};}}catch(e){}
 const methods=[];
 const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function prog(id){if(!S.m[id])S.m[id]={visited:[],video:false,sample:0,prompt:false,quiz:null,task:'',note:''};return S.m[id];}
 let onSave=()=>{};
 function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}onSave();}
 let AC=null;const st={muted:false};
 function beep(kind){if(st.muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const seq=kind==='ok'?[[660,0],[880,.09]]:kind==='no'?[[220,0],[180,.12]]:kind==='tick'?[[740,0]]:[[523,0],[659,.1],[784,.2],[1046,.3]];
  seq.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='no'?'sawtooth':'triangle';o.frequency.value=f;
   g.gain.setValueAtTime(.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.16,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.22);
   o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.25);});}catch(e){}}
 async function copyText(txt,el){try{await navigator.clipboard.writeText(txt);if(el){el.textContent='تم النسخ ✓';setTimeout(()=>el.textContent='',2200);}return true;}catch(e){if(el)el.textContent='حدّدي النص وانسخيه يدوياً';return false;}}
 const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
 return {add:m=>methods.push(m),methods,esc,prog,save,beep,copyText,shuffle,st,setOnSave:f=>onSave=f};
})();
</script>

<script>
(function(){const {esc,beep,shuffle}=BK;
const ROLES=[['👑','القائدة','تدير الحوار وتوزّع الكلمة'],['📝','المقرّرة','تكتب وتعرض'],['⏱️','مراقبة الوقت','تضبط الوقت والهدوء'],['🔎','الباحثة','تُحضر الدليل من الكتاب']];
const TASKS=['الإيمان بالله','الإيمان بالملائكة','الإيمان بالكتب','الإيمان بالرسل','الإيمان باليوم الآخر','الإيمان بالقدر'];
function bindGroups(el,done){const box=el.querySelector('#cp');let names='سارة، ريم، جود، نورة، هيا، لمى، دانة، منى، شهد، رهف، العنود، مريم',size=4,groups=null,stars={};
 function make(){const list=names.split(/[،,\n]/).map(s=>s.trim()).filter(Boolean);const sh=shuffle(list);const n=Math.max(1,Math.round(sh.length/size));groups=Array.from({length:n},()=>[]);sh.forEach((x,i)=>groups[i%n].push(x));stars={};beep('win');done(1);draw();}
 function draw(){box.innerHTML=`<div class="form"><div><label for="cN">أسماء الطالبات (افصلي بفاصلة)</label><textarea id="cN" rows="2">${esc(names)}</textarea></div>
  <div class="row"><label for="cS" style="margin:0">حجم المجموعة</label><select id="cS" style="width:auto">${[3,4,5].map(v=>`<option ${v===size?'selected':''}>${v}</option>`).join('')}</select><button class="btn sm" id="cGo">كوّني المجموعات ووزّعي الأدوار</button></div></div>
  ${groups?`<div class="dcols" style="margin-top:8px">${groups.map((g,gi)=>`<div class="dcol" style="--c:${['#0B6E6E','#6A4C93','#B08515','#CF4B26','#2A7FB8','#2E8B57'][gi%6]}"><h5>مجموعة ${gi+1} · مهمتها: ${TASKS[gi%TASKS.length]}</h5>${g.map((nm,mi)=>{const r=ROLES[mi%ROLES.length],k=gi+'-'+mi;return `<div class="note" style="flex-wrap:wrap"><span><b>${r[0]} ${esc(nm)}</b> — ${r[1]}<br><span class="src">${r[2]}</span></span><span>${[1,2,3].map(s=>`<button data-k="${k}" data-s="${s}" aria-label="تقييم ${s}" style="background:none;padding:0 1px">${(stars[k]||0)>=s?'⭐':'☆'}</button>`).join('')}</span></div>`;}).join('')}</div>`).join('')}</div>
  <p class="src" style="margin-top:6px">⭐ تقييم الأقران لمشاركة كل عضو. مهام المجموعات من درس «أركان الإيمان» (طريقة جولة الخبراء).</p>`:'<p class="src" style="margin-top:8px">الأسماء أمثلة؛ اكتبي أسماء طالباتك ثم اضغطي الزر.</p>'}`;
  box.querySelector('#cN').oninput=e=>names=e.target.value;box.querySelector('#cS').onchange=e=>size=+e.target.value;box.querySelector('#cGo').onclick=make;
  box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{stars[b.dataset.k]=+b.dataset.s;beep('tick');draw();});}
 draw();}
BK.add({id:'coop',unit:8,name:'التعلّم التعاوني',alt:'المجموعات المتعاونة',color:'#1F3A5F',
 def:'طريقة يعمل فيها الطلاب في <strong>مجموعات صغيرة غير متجانسة</strong> (4–5 طلاب) لإنجاز مهمة مشتركة، ويتحمّل كل فرد مسؤولية دوره، ولا تنجح المجموعة إلا بنجاح أفرادها.',
 evidence:'<p class="quran">«وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ» <span class="src">(المائدة: 2)</span></p><p>وقال صلى الله عليه وسلم: «المؤمن للمؤمن كالبنيان يشدّ بعضه بعضاً» وشبّك بين أصابعه <span class="src">(متفق عليه)</span>.</p>',
 aims:['تنمية روح الفريق والمسؤولية الفردية والجماعية.','إشراك جميع الطلاب وتقليل السلبية.','تعلّم الطلاب من بعضهم.','تنمية المهارات الاجتماعية وآداب الحوار.'],

<script>
(function(){const {esc,beep,shuffle}=BK;
const STEPS=[['🤲','النية والتسمية'],['👐','غسل الكفين ثلاثاً'],['💧','المضمضة والاستنشاق'],['😊','غسل الوجه'],['💪','غسل اليدين إلى المرفقين'],['🙆','مسح الرأس والأذنين'],['🦶','غسل الرجلين إلى الكعبين'],['☝️','الدعاء بعد الوضوء']];
const CHK=['غسل الوجه','اليدان إلى المرفقين','مسح الرأس','الرجلان إلى الكعبين','الترتيب','عدم الإسراف في الماء'];
function bindSim(el,done){const box=el.querySelector('#sim');let tab='order',seq=[],checked=false,roster=[['سارة',[1,1,1,1,1,0]],['ريم',[1,1,0,1,1,1]],['جود',[0,0,0,0,0,0]]];
 function draw(){
  let body='';
  if(tab==='order'){const sh=box._sh||(box._sh=shuffle(STEPS.map((_,i)=>i)));
   body=`<p style="font-size:14px;margin-bottom:6px">اضغطي البطاقات بالترتيب الصحيح لخطوات الوضوء.</p>
   <div class="slots">${STEPS.map((_,k)=>{const v=seq[k];const cls=v==null?'':checked?(v===k?'ok':'no'):'fill';return `<div class="${cls}">${v!=null?STEPS[v][0]+' '+esc(STEPS[v][1]):''}</div>`;}).join('')}</div>
   <div class="cards">${sh.map(i=>`<button data-c="${i}" ${seq.includes(i)||checked?'disabled':''}>${STEPS[i][0]} ${esc(STEPS[i][1])}</button>`).join('')}</div>
   <div class="row" style="margin-top:8px"><button class="btn sm" id="sChk" ${seq.length===STEPS.length&&!checked?'':'disabled'}>تحقّقي</button><button class="btn sm ghost" id="sUndo">تراجع</button><button class="btn sm ghost" id="sNew">من جديد</button><span id="sRes" style="font-weight:700"></span></div>`;}
  else{body=`<p style="font-size:14px;margin-bottom:6px">قائمة شطب المعلّمة أثناء التطبيق العملي. الأسماء أمثلة؛ أضيفي طالباتك.</p>
   <div class="tbl"><table class="chk"><tr><th>الطالبة</th>${CHK.map(c=>`<th>${c}</th>`).join('')}<th>الدرجة</th></tr>
   ${roster.map((r,ri)=>`<tr><td><b>${esc(r[0])}</b></td>${r[1].map((v,ci)=>`<td><input type="checkbox" data-r="${ri}" data-ci="${ci}" ${v?'checked':''} aria-label="${esc(r[0])}: ${CHK[ci]}"></td>`).join('')}<td><b>${r[1].filter(Boolean).length}/${CHK.length}</b></td></tr>`).join('')}</table></div>
   <div class="dadd"><input type="text" id="sName" placeholder="اسم الطالبة" maxlength="30"><button class="btn sm" id="sAdd">إضافة</button></div>`;}
  box.innerHTML=`<div class="tabs"><button data-t="order" class="${tab==='order'?'on':''}">رتّبي الخطوات</button><button data-t="list" class="${tab==='list'?'on':''}">قائمة الشطب</button></div>${body}`;
  box.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();});
  if(tab==='order'){
   box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{seq.push(+b.dataset.c);beep('tick');draw();});
   box.querySelector('#sUndo').onclick=()=>{if(!checked){seq.pop();draw();}};
   box.querySelector('#sNew').onclick=()=>{seq=[];checked=false;box._sh=null;draw();};
   const c=box.querySelector('#sChk');c.onclick=()=>{checked=true;const n=seq.filter((v,k)=>v===k).length;beep(n===STEPS.length?'win':'no');done(1);draw();box.querySelector('#sRes').textContent=n===STEPS.length?'ممتاز! الترتيب صحيح كله.':`${n} من ${STEPS.length} في مكانها الصحيح؛ راجعي الأحمر.`;};}
  else{box.querySelectorAll('[data-r]').forEach(i=>i.onchange=()=>{roster[+i.dataset.r][1][+i.dataset.ci]=i.checked?1:0;done(1);draw();});
   box.querySelector('#sAdd').onclick=()=>{const n=box.querySelector('#sName').value.trim();if(!n)return;roster.push([n,CHK.map(()=>0)]);draw();};}
 }
 draw();}

<script>
(function(){const {esc,beep}=BK;
const GROUPS=[['البيت','#0B6E6E'],['المدرسة','#6A4C93'],['السوق','#B08515'],['الإنترنت','#CF4B26']];
const SEED=[[0,'حين تصدق البنت مع أمها تثق بها وتعطيها حرية أكبر.',3],[1,'الطالبة الصادقة لا تخاف من الاختبار لأنها لا تغش.',2],[2,'التاجر الصادق يعود إليه الزبائن ويبارك الله في بيعه.',4],[3,'الكذب ينتشر بسرعة في الإنترنت، فالتثبت صدق مع النفس والناس.',3],[2,'إخفاء عيب السلعة يُذهب البركة.',2]];
function bindBoard(el,done){
 let notes=SEED.map((n,i)=>({g:n[0],t:n[1],v:n[2],id:i})),nid=99,touched=false;
 const box=el.querySelector('#dboard');
 function draw(){
  box.innerHTML=`<div class="dtopic">القضية: لو اختفى الصدق من مجتمعنا يوماً واحداً، ماذا سيحدث؟</div>
  <div class="dcols">${GROUPS.map((g,i)=>`<div class="dcol" style="--c:${g[1]}"><h5>مجموعة ${i+1}: ${g[0]}</h5>${notes.filter(n=>n.g===i).sort((a,b)=>b.v-a.v).map(n=>`<div class="note"><span>${esc(n.t)}</span><button data-v="${n.id}" aria-label="أؤيد هذه الفكرة">👍 ${n.v}</button></div>`).join('')||'<p class="src">لا آراء بعد.</p>'}</div>`).join('')}</div>
  <div class="dadd"><select id="dG" aria-label="المجموعة">${GROUPS.map((g,i)=>`<option value="${i}">${g[0]}</option>`).join('')}</select><input type="text" id="dT" maxlength="140" placeholder="اكتبي رأي مجموعتك بجملة واحدة"><button class="btn sm" id="dAdd">أضيفي</button></div>
  <div class="row" style="margin-top:8px"><button class="btn gold sm" id="dSum">اعرضي خلاصة المناقشة</button><span class="src">الآراء الأولى أمثلة جاهزة للتجربة.</span></div><div id="dOut"></div>`;
  box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const n=notes.find(x=>x.id==b.dataset.v);n.v++;beep('tick');mark();draw();});
  box.querySelector('#dAdd').onclick=()=>{const t=box.querySelector('#dT').value.trim();if(!t)return;notes.push({g:+box.querySelector('#dG').value,t,v:0,id:nid++});beep('ok');mark();draw();};
  box.querySelector('#dSum').onclick=()=>{const top=notes.slice().sort((a,b)=>b.v-a.v).slice(0,3);beep('win');mark();
   box.querySelector('#dOut').innerHTML=`<div class="box gold"><b class="k">خلاصة الصف (الأكثر تأييداً)</b><ol style="margin:0">${top.map(n=>`<li>${esc(n.t)} <span class="src">(${GROUPS[n.g][0]} · ${n.v} 👍)</span></li>`).join('')}</ol>
   <p style="margin:6px 0 0"><b>الربط بالدليل:</b> قال صلى الله عليه وسلم: «إن الصدق يهدي إلى البرّ، وإن البرّ يهدي إلى الجنة» <span class="src">(متفق عليه)</span>.</p></div>`;};
 }
 function mark(){if(!touched){touched=true;done(1);}}
 draw();
}

المطلوب:
1. خمس بطاقات ملوّنة للخطوات: التمهيد، العرض، الربط والموازنة، الاستنباط، التطبيق؛ لكل بطاقة وصف قصير وخانة كتابة وخانة زمن بالدقائق.
2. املأ البطاقات مسبقاً بمقترح لدرس [الأمانة] من الدرس المرفق فقط (الآيات والأحاديث كما وردت مع المصدر)، مع إمكان التعديل.
3. عدّاد لمجموع الزمن يحذّر إذا تجاوز 45 دقيقة.
4. زر «اعرض الخطة» يعرضها منسّقة بشريط زمني ملوّن، وزر «نسخ الخطة» نصاً.
5. ألوان هادئة وخط واضح.

<script>
(function(){const {esc,beep}=BK;

1. 5–7 شرائح متتابعة بالخطوات: التمهيد، العرض، التوضيح، التلخيص، التقويم.
2. في كل شريحة فقرة قصيرة، وبطاقة «الكلمات المفتاحية».

5. شريحة أخيرة بالتلخيص و3 أسئلة تقويم.
6. خط كبير مناسب للعرض على السبورة، دون صور لأشخاص.

الدرس: [الأمانة / تحريم الغش]

اعتمد على الأدلة في الدرس المرفق فقط، وانقلها كما وردت مع المصدر.

المطلوب:
1. موقف واقعي من حياة الطلاب يتعلق بالدرس، تُعرض فيه المشكلة بشخصية افتراضية.
2. مسار يمر بخطوات حل المشكلات الست: الشعور بالمشكلة، تحديدها، جمع المعلومات (اختيار الدليل)، اقتراح الحلول، اختبارها، اختيار الأنسب.
3. في كل خطوة اختياران أو ثلاثة؛ الاختيار الخاطئ يفتح شاشة توضيح ثم يعيد الطالب، والصحيح ينقله للخطوة التالية.
4. ثلاثة حلول ممكنة لكل منها نتيجة مختلفة وتعليق تربوي بالدليل.
5. شريط تقدّم يبيّن الخطوة الحالية، وشاشة نهاية تلخّص الخطوات.
6. دون صور لأشخاص.

function bindGame(el,done){
 const box=el.querySelector('#game');let G=null;
 function menu(){box.innerHTML=`<h3>تحدّي الصلاة 🕌</h3><p style="opacity:.85;font-size:14px">اختاري المستوى. لكل مستوى 4 أسئلة، ونقاط أعلى للأصعب.</p>
  <div class="lvlpick">${Object.entries(GAME).map(([k,v])=>`<button data-l="${k}" style="background:${v.col}">${v.name} · ${v.pts} نقطة للسؤال</button>`).join('')}</div>
  <div class="gbtns"><button class="alt" id="gMute">${BK.st.muted?'🔇 الصوت مكتوم':'🔊 الصوت يعمل'}</button><label style="font-size:13px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="gTimer" checked> مؤقّت 20 ثانية</label></div>`;
  box.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(b.dataset.l,box.querySelector('#gTimer').checked));
  box.querySelector('#gMute').onclick=e=>{BK.st.muted=!BK.st.muted;e.target.textContent=BK.st.muted?'🔇 الصوت مكتوم':'🔊 الصوت يعمل';};}
 function start(l,useT){G={l,i:0,score:0,wrong:[],help:true,useT,t:20,ti:null,done:false};q();}
 function stopT(){if(G&&G.ti){clearInterval(G.ti);G.ti=null;}}
 function q(){stopT();const L=GAME[G.l],it=L.qs[G.i];G.done=false;G.seq=[];
  let body='';
  if(it.k==='mc') body=`<div class="opts">${it.o.map((o,j)=>`<button class="opt" data-o="${j}">${esc(o)}</button>`).join('')}</div>`;
  else if(it.k==='tf') body=`<div class="opts" style="grid-template-columns:1fr 1fr"><button class="opt" data-o="t">✓ صح</button><button class="opt" data-o="f">✗ خطأ</button></div>`;
  else {const sh=shuffle(it.o.map((o,j)=>j));body=`<div class="seq" id="seq" aria-label="ترتيبك"></div><div class="opts" style="grid-template-columns:1fr 1fr">${sh.map(j=>`<button class="opt" data-s="${j}">${esc(it.o[j])}</button>`).join('')}</div>`;}
  box.innerHTML=`<div class="gtop"><span>${L.name}</span><span>السؤال ${G.i+1} / ${L.qs.length}</span><span>⭐ ${G.score}</span>${G.useT?`<span id="gT">⏱ ${G.t}</span>`:''}</div>
   <div class="gbar"><i style="width:${100*G.i/L.qs.length}%"></i></div><div class="gq pop">${esc(it.q)}</div>${body}<div id="fb"></div>
   <div class="gbtns">${it.k==='mc'&&G.help?'<button class="alt" id="gHelp">احذف إجابتين</button>':''}${it.k==='or'?'<button class="alt" id="gUndo">تراجع</button>':''}<button class="alt" id="gQuit">القائمة</button></div>`;
  box.querySelector('#gQuit').onclick=()=>{stopT();menu();};
  const hb=box.querySelector('#gHelp');if(hb)hb.onclick=()=>{G.help=false;shuffle(it.o.map((_,j)=>j).filter(j=>j!==it.a)).slice(0,2).forEach(j=>box.querySelector(`[data-o="${j}"]`).classList.add('gone'));hb.remove();};
  if(it.k==='or'){const seq=box.querySelector('#seq');
   box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(G.done)return;G.seq.push(+b.dataset.s);b.disabled=true;b.style.opacity=.35;seq.innerHTML=G.seq.map(j=>`<span>${esc(it.o[j])}</span>`).join('');if(G.seq.length===it.o.length)answer(G.seq.every((v,k)=>v===k));});
   box.querySelector('#gUndo').onclick=()=>{if(G.done||!G.seq.length)return;const j=G.seq.pop();const b=box.querySelector(`[data-s="${j}"]`);b.disabled=false;b.style.opacity=1;seq.innerHTML=G.seq.map(k=>`<span>${esc(it.o[k])}</span>`).join('');};}
  else box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(G.done)return;const v=b.dataset.o;const ok=it.k==='mc'?(+v===it.a):((v==='t')===it.a);b.classList.add(ok?'ok':'no');
   if(!ok){const c=it.k==='mc'?box.querySelector(`[data-o="${it.a}"]`):box.querySelector(`[data-o="${it.a?'t':'f'}"]`);c&&c.classList.add('ok');}answer(ok);});
  if(G.useT){G.t=20;G.ti=setInterval(()=>{if(!box.isConnected){stopT();return;}G.t--;const t=box.querySelector('#gT');if(t)t.textContent='⏱ '+G.t;if(G.t<=0){stopT();answer(false,true);}},1000);}
 }
 function answer(ok,timeout){if(G.done)return;G.done=true;stopT();const L=GAME[G.l],it=L.qs[G.i];
  box.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(ok){G.score+=L.pts;beep('ok');}else{G.wrong.push(it);beep('no');}
  box.querySelector('#fb').innerHTML=`<div class="feedback pop" style="background:${ok?'rgba(30,138,76,.35)':'rgba(168,53,42,.4)'}"><b>${ok?'أحسنتِ! ':timeout?'انتهى الوقت. ':'ليست الإجابة الصحيحة. '}</b>${esc(it.e)}</div>`;
  const nb=document.createElement('button');nb.textContent=G.i+1<L.qs.length?'السؤال التالي ←':'النتيجة';nb.onclick=()=>{G.i++;G.i<L.qs.length?q():end();};
  box.querySelector('.gbtns').prepend(nb);nb.focus();}
 function end(){const L=GAME[G.l],max=L.qs.length*L.pts;beep('win');done(G.score);
  box.innerHTML=`<h3>انتهى المستوى!</h3><div class="gq" style="font-size:30px;color:#F0C75E">⭐ ${G.score} / ${max}</div>
  <p>${G.score===max?'إتقان كامل، بارك الله فيكِ!':G.score>=max/2?'أداء جيد، راجعي الأسئلة أدناه.':'لا بأس، راجعي ثم أعيدي المحاولة.'}</p>
  ${G.wrong.length?`<div class="feedback"><b>مراجعة الأخطاء</b><ul style="margin:4px 0 0;padding-inline-start:18px">${G.wrong.map(w=>`<li>${esc(w.q)}<br><span style="opacity:.85">${esc(w.e)}</span></li>`).join('')}</ul></div>`:''}
  <div class="gbtns"><button id="gAgain">العب مرة أخرى</button><button class="alt" id="gMenu">مستوى آخر</button></div>`;
  box.querySelector('#gAgain').onclick=()=>start(G.l,G.useT);box.querySelector('#gMenu').onclick=menu;}
 menu();
}

 prompt:`أنت مصمّم ألعاب تعليمية ومطوّر ويب. أنشئ لي لعبة أسئلة تفاعلية في ملف HTML واحد (HTML وCSS وJavaScript داخل الملف نفسه) تعمل مباشرة في المتصفح وعلى الجوال، باللغة العربية واتجاه الكتابة من اليمين إلى اليسار.

المادة: التربية الإسلامية
المرحلة: [المتوسطة]
الدرس: [اكتب اسم الدرس، مثل: شروط الصلاة]

المحتوى:
- اعتمد فقط على نص الدرس المرفق، ولا تضف آيات أو أحاديث أو أحكاماً من خارجه.
- انقل الآيات والأحاديث كما وردت في الدرس، واذكر مصدر الحديث كما هو مكتوب فيه.

مواصفات اللعبة:
1. ثلاثة مستويات: سهل (تذكّر)، متوسط (فهم وتطبيق)، صعب (تحليل وتقويم)، في كل مستوى 5 أسئلة.
2. أنواع الأسئلة: اختيار من متعدد بأربعة بدائل، صح أو خطأ، وسؤال ترتيب واحد على الأقل في كل مستوى.
3. تصحيح فوري: أخضر للصحيح وأحمر للخطأ، مع جملة قصيرة تشرح الإجابة الصحيحة.
4. نقاط تزيد مع صعوبة المستوى، وشريط تقدّم، ومؤقت 20 ثانية يمكن إيقافه.
5. وسيلة مساعدة واحدة في كل لعبة: «احذف إجابتين».
6. مؤثرات صوتية بسيطة مولّدة بالمتصفح (Web Audio) دون ملفات خارجية، مع زر كتم الصوت.
7. شاشة نهاية تعرض الدرجة ومراجعة الأسئلة الخاطئة وزر «العب مرة أخرى».
8. ألوان مبهجة وخط كبير واضح يناسب طلاب [المرحلة]، دون صور لأشخاص، ودون تصوير للأنبياء أو الصحابة.

بعد إنشائها اعرضها لي لأجرّبها مباشرة، ثم اكتب لي قائمة الأسئلة والإجابات لأراجعها.`,

function bindStory(el,done){const box=el.querySelector('#sbook');let i=0,ans=null,sel=[];
 function draw(){const s=SCN[i];box.innerHTML=`<div class="art">${art(...s.a)}</div><div class="txt">${esc(s.t)}${s.ask?`<div class="ask"><b>⏸ وقفة: ${esc(s.ask.q)}</b>${s.ask.o.map((o,j)=>`<button data-k="${j}" class="${ans!=null?(j===s.ask.a?'ok':(j===ans?'no':'')):''}">${esc(o)}</button>`).join('')}</div>`:''}${s.end?`<div class="ask"><b>اختاري العِبَر الصحيحة من القصة:</b>${LESSONS.map((l,j)=>`<button data-l="${j}" class="${sel.includes(j)?(l[1]?'ok':'no'):''}">${esc(l[0])}</button>`).join('')}</div>`:''}</div>
 <div class="bar"><button id="sPrev" ${i?'':'disabled'}>→</button><div class="dots">${SCN.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><button id="sNext" ${i<SCN.length-1?'':'disabled'}>←</button></div>`;
  box.querySelector('#sPrev').onclick=()=>{i--;draw();};box.querySelector('#sNext').onclick=()=>{i++;beep('tick');draw();if(i===SCN.length-1)done(1);};
  box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ans=+b.dataset.k;beep(ans===SCN[i].ask.a?'ok':'no');draw();});
  box.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const j=+b.dataset.l;if(!sel.includes(j)){sel.push(j);beep(LESSONS[j][1]?'ok':'no');}draw();});}
 draw();}

function filSVG(k,t){
 const E=x=>x<0?0:x>1?1:x;let s=`<svg viewBox="0 0 480 270" role="img" aria-label="مشهد رمزي من سورة الفيل"><defs><linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5C98B"/><stop offset="1" stop-color="#FBE8C6"/></linearGradient></defs><rect width="480" height="270" fill="url(#fsky)"/>
 <path d="M0 175 Q60 120 130 150 Q200 110 280 150 Q360 120 480 160 L480 270 L0 270Z" fill="#C79A63"/><path d="M0 205 Q120 180 240 200 Q360 182 480 205 L480 270 L0 270Z" fill="#D9B27C"/>`;
 const kx=k==='lessons'?205:70;
 s+=`<g transform="translate(${kx} 140)">${k==='lessons'?`<circle cx="35" cy="25" r="${60+8*Math.sin(t*6)}" fill="#FFF3C4" opacity=".55"/>`:''}<path d="M0 10 L40 0 L70 10 L70 70 L40 80 L0 70Z" fill="#141414"/><path d="M40 0 L70 10 L70 70 L40 80Z" fill="#262626"/><path d="M0 24 L40 14 L70 24 L70 31 L40 21 L0 31Z" fill="#C9A227"/><rect x="47" y="40" width="9" height="26" fill="#C9A227"/></g>`;
 if(k==='intro'){s+=`<text x="300" y="95" text-anchor="middle" font-family="Reem Kufi,Tahoma" font-size="26" fill="#5b3a12">قصة من القرآن</text><text x="300" y="130" text-anchor="middle" font-family="Amiri,serif" font-size="30" fill="#7a2e12" opacity="${E(t*2)}">أصحاب الفيل</text>`;}
 const army=(x0,fade)=>{let g='';for(let r=0;r<3;r++)for(let c=0;c<5;c++){const x=x0+40+c*26+r*9,y=172+r*12;g+=`<g opacity="${fade}"><path d="M${x} ${y} L${x} ${y-34}" stroke="#4a2f1a" stroke-width="2"/><path d="M${x} ${y-34} L${x+12} ${y-29} L${x} ${y-24}Z" fill="${['#8b1e1e','#3f3a7a','#6b4e16'][r]}"/><ellipse cx="${x}" cy="${y+3}" rx="7" ry="3" fill="#000" opacity=".15"/></g>`;}return g;};
 const ele=(x,bob,op)=>`<g transform="translate(${x} ${168+bob})" opacity="${op}"><ellipse cx="0" cy="0" rx="34" ry="22" fill="#6d6a66"/><circle cx="-34" cy="-8" r="15" fill="#6d6a66"/><path d="M-46 -2 Q-56 16 -48 30" stroke="#6d6a66" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M-24 -18 Q-14 -2 -26 4" fill="#5c5955"/><rect x="-26" y="12" width="9" height="20" fill="#6d6a66"/><rect x="-6" y="12" width="9" height="20" fill="#6d6a66"/><rect x="12" y="12" width="9" height="20" fill="#6d6a66"/><rect x="24" y="10" width="8" height="20" fill="#6d6a66"/><circle cx="-38" cy="-12" r="2" fill="#222"/></g>`;
 if(k==='march'){const x=470-210*E(t*1.1);s+=army(x,1)+ele(x,Math.sin(t*30)*1.5,1);}
 if(k==='halt'){s+=army(260,1)+ele(260,0,1)+`<text x="230" y="120" font-size="30" fill="#7a2e12" font-family="Reem Kufi" opacity="${.4+.6*Math.abs(Math.sin(t*5))}">؟</text><text x="290" y="110" font-size="22" fill="#7a2e12" font-family="Reem Kufi" opacity="${.4+.6*Math.abs(Math.cos(t*4))}">؟</text>`;}
 if(k==='birds'||k==='stones'){s+=army(260,1)+ele(260,0,1);for(let i=0;i<26;i++){const w=Math.floor(i/6),x=-30+(E(t*1.25-w*.12))*(260+i%6*30),y=40+(i%6)*9+w*7;s+=`<path d="M${x-7} ${y-4} Q${x-3} ${y} ${x} ${y} Q${x+3} ${y} ${x+7} ${y-4}" stroke="#3b2a20" stroke-width="2" fill="none"/>`;
   if(k==='stones'&&x>200){const ft=E((t-.15-(i%5)*.06)*1.6);s+=`<circle cx="${x+2}" cy="${y+ft*(150-y+i%3*8)}" r="2.6" fill="#7a4b2a"/>`;}}}
 if(k==='end'){for(let i=0;i<60;i++){const x=270+((i*37)%170),y=172+((i*13)%34);const a=(i*47)%180;s+=`<path d="M${x} ${y} l${6*Math.cos(a)} ${3*Math.sin(a)}" stroke="#a88a4a" stroke-width="2" opacity="${E(t*2)}"/>`;}s+=army(260,1-E(t*2))+ele(260,0,1-E(t*2));}
 if(k==='lessons'){['الله يحمي بيته الحرام','عاقبة الكيد والظلم الخسران','التوكّل على الله'].forEach((l,i)=>{s+=`<text x="${i===1?380:i===0?390:370}" y="${70+i*34}" text-anchor="middle" font-family="IBM Plex Sans Arabic,Tahoma" font-size="17" font-weight="700" fill="#5b3a12" opacity="${E(t*3-i*.6)}">◆ ${l}</text>`;});}
 return s+'</svg>';}
function bindFil(el,done){const box=el.querySelector('#filBox');let i=0,t=0,play=false,raf=null,last=0,voice=false;const D=7;
 box.innerHTML=`<div class="player"><div class="scr" id="filScr"></div><div class="cap" id="filCap"></div><div class="ctrl"><button class="play" id="fPl">▶ تشغيل</button><button id="fPr" aria-label="المشهد السابق">→</button><button id="fNx" aria-label="المشهد التالي">←</button><div class="segs" id="fSeg">${FILV.map((_,j)=>`<b data-s="${j}"></b>`).join('')}</div><button id="fVo" aria-pressed="false">🔈 التعليق</button></div></div>`;
 const scr=box.querySelector('#filScr'),cap=box.querySelector('#filCap'),seg=box.querySelector('#fSeg');
 function paint(){const v=FILV[i];scr.innerHTML=filSVG(v.k,t)+(v.a?`<div style="position:absolute;top:0;inset-inline:0;padding:8px 12px;background:linear-gradient(#0f2a2cee,#0f2a2c99);text-align:center"><span class="quran" style="color:#F6E7A8;font-size:clamp(16px,3.6vw,24px)">﴿${v.a}﴾ <span style="font-size:13px">(${v.n})</span></span></div>`:'');
  cap.innerHTML=`<span class="who">${i+1}/${FILV.length} · ${v.a?'الآية '+v.n:(v.k==='intro'?'المقدمة':'الدروس')}</span>${esc(v.cap)}`;[...seg.children].forEach((b,j)=>b.className=j<i?'on':j===i?'cur':'');box.querySelector('#fPl').textContent=play?'❚❚ إيقاف':'▶ تشغيل';}
 function speak(){if(!voice)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(FILV[i].cap);u.lang='ar-SA';const v=speechSynthesis.getVoices().find(x=>/^ar/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
 function loop(ts){if(!play||!box.isConnected){play=false;return;}if(!last)last=ts;t+=(ts-last)/1000/D;last=ts;if(t>=1){if(i<FILV.length-1){i++;t=0;speak();}else{t=1;play=false;done(1);}}paint();if(play)raf=requestAnimationFrame(loop);}
 function stop(){play=false;cancelAnimationFrame(raf);try{speechSynthesis.cancel();}catch(e){}paint();}
 box._stop=stop;
 box.querySelector('#fPl').onclick=()=>{if(play){stop();return;}if(i===FILV.length-1&&t>=1){i=0;t=0;}play=true;last=0;speak();raf=requestAnimationFrame(loop);};
 box.querySelector('#fPr').onclick=()=>{stop();i=Math.max(0,i-1);t=.999;paint();};
 box.querySelector('#fNx').onclick=()=>{stop();i=Math.min(FILV.length-1,i+1);t=.999;if(i===FILV.length-1)done(1);paint();};
 seg.onclick=e=>{const b=e.target.closest('[data-s]');if(b){stop();i=+b.dataset.s;t=.999;paint();}};
 box.querySelector('#fVo').onclick=e=>{voice=!voice;e.currentTarget.textContent=voice?'🔊 التعليق':'🔈 التعليق';e.currentTarget.setAttribute('aria-pressed',voice);if(!voice){try{speechSynthesis.cancel();}catch(_){}}};
 t=.999;paint();}

 prompt:`أنت مخرج رسوم متحركة تعليمية ومطوّر ويب. أنشئ «فيديو رسوم متحركة» لقصة من القرآن الكريم في ملف HTML واحد (HTML وCSS وJavaScript داخل الملف، والرسوم SVG أو Canvas داخل الملف) يعمل في المتصفح وعلى الجوال، بالعربية ومن اليمين إلى اليسار.

المادة: التربية الإسلامية
المرحلة: [الابتدائية]
القصة: [أصحاب الفيل — سورة الفيل]

الضوابط الشرعية:
- انقل نص الآيات حرفياً من الصورة المرفقة من المصحف، مع رقم كل آية، ولا تكتبها من الذاكرة.
- اعتمد في معاني المفردات والأحداث على الصفحة المرفقة من كتاب الطالب فقط، ولا تضف أحداثاً أو أسماء أو حوارات غير واردة فيها.
- لا ترسم الأنبياء ولا الصحابة ولا وجوه الأشخاص؛ مثّل الجيش برايات ورماح وظلال، والكعبة مكعباً أسود بحزام ذهبي.
- لا تقرأ الآيات بالصوت الآلي؛ الصوت الآلي للتعليق فقط.

المشاهد (6–7 مشاهد، لكل مشهد 6–8 ثوانٍ):
1. مشهد افتتاحي: عنوان القصة ومكانها (مكة والكعبة).
2. لكل آية مشهد: نص الآية بخط كبير في أعلى الشاشة، ورسم متحرك رمزي يمثّل معناها، وتعليق قصير في أسفل الشاشة يشرح المعنى بلغة الأطفال.
3. مشهد ختامي بالدروس المستفادة في 3 نقاط.

التحكم والتقنية:
- أزرار: تشغيل/إيقاف، مشهد سابق/تالٍ، وشريط تقدّم مقسّم بالمشاهد.
- زر «التعليق الصوتي» يقرأ التعليق (لا الآيات) بصوت المتصفح العربي إن وُجد.
- زر ملء الشاشة، ونسبة عرض 16:9 مناسبة لتسجيل الشاشة.
- ألوان دافئة هادئة، وحركة سلسة غير مزعجة.

اعرض الفيديو لأشاهده، ثم اكتب لي جدولاً بالمشاهد: نص الآية، والرسم، والتعليق؛ لأراجعه.`,

 prompt:`أنت مصمّم تجارب تعليمية ثلاثية الأبعاد ومطوّر ويب محترف، ولديك خبرة في الرسوم ثلاثية الأبعاد في المتصفح (Three.js أو WebGL) وفي التصميم التعليمي للتربية الإسلامية.

المطلوب: أنشئ «جولة افتراضية ثلاثية الأبعاد» (3D Virtual Tour) تحاكي أداء العمرة خطوة بخطوة، من لحظة الوصول إلى الميقات حتى التحلّل من الإحرام، بحيث تُعرض كفيديو تعليمي تلقائي، ويمكن أيضاً التنقّل فيها يدوياً.

المادة: التربية الإسلامية
المرحلة: [الثالث المتوسط]
الدرس: [العمرة: أركانها وواجباتها وسننها] — الصفحات مرفقة

أولاً: المحتوى والدقة الشرعية
- اعتمد في المناسك وأحكامها (ركن، واجب، سنّة) والأدعية على صفحات الدرس المرفقة فقط، وانقل الآيات والأحاديث حرفياً مع مصدرها.
- لا تضف أقوالاً فقهية أو أدعية غير واردة في الدرس.
- لا تُظهر وجوه أشخاص؛ يُمثَّل المعتمرون بظلال بيضاء بسيطة متحركة باحترام، ولا يُصوَّر أي نبي أو صحابي.

ثانياً: المحطات بالترتيب (لكل محطة مشهد ثلاثي الأبعاد وحركة كاميرا)
1. الوصول إلى الميقات: الاغتسال ولبس الإحرام ونية العمرة، مع نص التلبية.
2. الطريق إلى مكة مع التلبية.
3. دخول المسجد الحرام بالرجل اليمنى ودعاء الدخول، ولقطة أولى للكعبة المشرفة.
4. الطواف: سبعة أشواط تبدأ من الحجر الأسود والكعبة عن اليسار ومن وراء حِجر إسماعيل، مع عدّاد للأشواط ظاهر، والدعاء بين الركن اليماني والحجر الأسود.
5. ركعتا الطواف خلف مقام إبراهيم مع الآية.
6. الشرب من ماء زمزم.
7. السعي: سبعة أشواط من الصفا إلى المروة مع عدّاد، والعلمان الأخضران، والآية عند الصفا.
8. الحلق أو التقصير، ثم شاشة «تمّت العمرة».

ثالثاً: المشهد ثلاثي الأبعاد
- نموذج مبسّط للمسجد الحرام: صحن الطواف، الكعبة (مكعب أسود بحزام ذهبي، والحجر الأسود، والباب، والميزاب، وحِجر إسماعيل)، ومقام إبراهيم، وموضع زمزم، والمسعى بين الصفا والمروة.
- إضاءة دافئة، وحركة كاميرا سلسة (اقتراب، دوران حول الكعبة أثناء الطواف، تتبّع على المسعى).
- تسميات توضيحية تظهر عند الاقتراب من كل معلَم.

رابعاً: الصوت والنصوص
- تعليق صوتي قصير لكل محطة بصوت المتصفح العربي إن وُجد (التعليق فقط، لا الآيات).
- ترجمة نصية أسفل الشاشة، وبطاقة لكل محطة: اسم المنسك، حكمه، ما يُقال فيه.

خامساً: التحكم
- زر «الجولة التلقائية» (فيديو)، وزر إيقاف، وأزرار المحطة السابقة والتالية، وشريط تقدّم بالمحطات.
- السحب للتدوير والتكبير بالإصبع أو الفأرة في الوضع اليدوي.
- زر ملء الشاشة، ونسبة 16:9 مناسبة لتسجيل الشاشة.
- ملف HTML واحد يعمل في المتصفح وعلى الجوال، بالعربية ومن اليمين إلى اليسار.

سادساً: الختام
- اختبار قصير من 5 أسئلة على ترتيب المناسك وأحكامها.

بعد الإنشاء اعرض الجولة لأجرّبها، ثم اكتب لي جدولاً بالمحطات والنصوص والأحكام لأطابقها مع الدرس.`,

<script>
(function(){
"use strict";
const {esc,prog,save,beep,copyText}=BK;
const PLAN=[
 ['questions','الأسئلة',7,'#0B6E6E'],['discussion','المناقشة والحوار',7,'#CF4B26'],['story','القصة',7,'#B08515'],['demo','العرض العملي',7,'#1F3A5F'],['lecture','المحاضرة',7,'#5C6E70'],
 ['induction','الاستقرائية',8,'#2E8B57'],['deduction','القياسية',8,'#6A4C93'],['herbart','خطوات هربارت',8,'#2A7FB8'],['discovery','الاكتشاف الموجّه',8,'#0B6E6E'],['problem','حل المشكلات',8,'#CF4B26'],['project','المشروع',8,'#B08515'],['coop','التعلم التعاوني',8,'#1F3A5F'],['roleplay','لعب الأدوار',8,'#6A4C93'],['selfl','التعلم الذاتي وأوراق العمل',8,'#2E8B57'],['trip','الزيارة الميدانية والرحلة',8,'#8A5A2B'],
 ['quran','تدريس القرآن والتدبّر',9,'#8A5A2B']];
const UNITN={7:'الوحدة السابعة · طرائق التدريس (1): العرض والحوار',8:'الوحدة الثامنة · طرائق التدريس (2): المتعلّم محور الموقف',9:'الوحدة التاسعة · تدريس فروع التربية الإسلامية'};
const byId=id=>BK.methods.find(m=>m.id===id);
let M=null; // current method
let pages=[];

/* ----- shared bits ----- */
function milestones(m){const P=prog(m.id);return [
 {t:'قرأتُ صفحات «أتعلّم» الأربع',d:[2,3,4,5].every(i=>P.visited.includes(i))},
 {t:'شاهدتُ المشهد التطبيقي حتى نهايته',d:!!P.video},
 {t:'جرّبتُ النشاط النموذجي',d:P.sample>0},
 {t:'نسختُ برومبت Claude أو استخدمتُ المختبر',d:!!P.prompt},
 {t:'اجتزتُ الاختبار القصير (4 من 6 فأكثر)',d:P.quiz!=null&&P.quiz>=4},
 {t:'سلّمتُ رابط نشاطي',d:!!P.task}];}
const pctOf=m=>{const x=milestones(m);return Math.round(100*x.filter(y=>y.d).length/x.length);};
function updMini(){const v=M?pctOf(M):Math.round(BK.methods.reduce((a,m)=>a+pctOf(m),0)/Math.max(1,BK.methods.length));
 document.getElementById('miniTxt').textContent=v+'%';document.getElementById('miniBar').style.width=v+'%';}
BK.setOnSave(updMini);
const STAGE={'الابتدائية':'جملاً قصيرة جداً وكلمات سهلة، وألواناً مبهجة وأيقونات كبيرة، وتشجيعاً بعبارات لطيفة','المتوسطة':'أسئلة «لماذا وكيف» وروح منافسة وتعاون، وتصميماً حيوياً','الثانوية':'مستوى تحليل وتقويم ومواقف من الواقع المعاصر، وتصميماً هادئاً ناضجاً'};
const TOPICS=['شروط الصلاة','الوضوء','بر الوالدين','الصدق والأمانة','سورة الفاتحة: معانيها وتلاوتها','أحكام النون الساكنة والتنوين','الهجرة النبوية','أركان الإيمان','حقوق الجار','آداب الطريق'];

/* ----- video stage ----- */
const NAMES={t:'المعلّمة',n:'الراوي',s0:'سارة',s1:'هيا',s2:'نورة',s3:'جود',s4:'ريم',s5:'لمى'};
let vState=null;
function stopVideo(){if(vState){vState.playing=false;clearTimeout(vState.to);clearInterval(vState.ti);}try{speechSynthesis.cancel();}catch(e){}}
function stageSVG(sc,li){
 const speak=li!=null?(sc.lines[li]||[])[0]:null;
 const studs=[[105,196],[190,196],[275,196],[145,150],[230,150],[315,150]],hcol=['#2E8B57','#6A4C93','#C9A227','#2A9DF4','#E4572E','#0B6E6E'];
 let s=`<svg viewBox="0 0 480 270" role="img" aria-label="${esc(sc.t)}"><rect width="480" height="270" fill="#EFE6D2"/><rect y="205" width="480" height="65" fill="#D8C7A4"/><rect x="52" y="20" width="290" height="92" rx="6" fill="#28473A" stroke="#8A5A2B" stroke-width="6"/>`;
 sc.board.forEach((b,i)=>{s+=`<text x="197" y="${sc.board.length===1?70:54+i*30}" text-anchor="middle" direction="rtl" font-family="IBM Plex Sans Arabic,Tahoma" font-size="${i?14:(b.length>24?15:19)}" fill="${i?'#F6E7A8':'#fff'}" font-weight="700">${esc(b)}</text>`;});
 studs.forEach(([x,y],i)=>{const k='s'+i,up=sc.raise.includes(i),sp=speak===k,sc2=i>2?.82:1;
  s+=`<g transform="translate(${x} ${y}) scale(${sc2})">${sp?`<circle cx="0" cy="-24" r="22" fill="#F0C75E" opacity=".55"/>`:''}${up?`<path d="M10 0 L20 -40" stroke="${hcol[i]}" stroke-width="7" stroke-linecap="round"/><circle cx="20" cy="-42" r="5" fill="#E8B98F"/>`:''}<path d="M-17 14 Q-17 -6 0 -6 Q17 -6 17 14 Z" fill="${hcol[i]}"/><circle cx="0" cy="-22" r="12" fill="#E8B98F"/><path d="M-13 -20 Q-13 -38 0 -38 Q13 -38 13 -20 Q13 -6 0 -4 Q-13 -6 -13 -20 Z M-8 -22 Q-8 -14 0 -13 Q8 -14 8 -22 Q8 -30 0 -30 Q-8 -30 -8 -22Z" fill="${hcol[i]}" fill-rule="evenodd" opacity=".9"/><rect x="-26" y="12" width="52" height="10" rx="3" fill="#9A6B3C"/></g>`;
  if(sp)s+=`<text x="${x}" y="${y+40}" text-anchor="middle" font-family="IBM Plex Sans Arabic,Tahoma" font-size="12" font-weight="700" fill="#1F3A5F">${NAMES[k]}</text>`;});
 s+=`<g transform="translate(405 170)">${speak==='t'?`<circle cx="0" cy="-40" r="28" fill="#F0C75E" opacity=".55"/>`:''}<path d="M-22 60 L-18 -10 Q0 -22 18 -10 L22 60 Z" fill="#0B6E6E"/><circle cx="0" cy="-38" r="15" fill="#E8B98F"/><path d="M-17 -36 Q-17 -60 0 -60 Q17 -60 17 -36 Q17 -18 0 -14 Q-17 -18 -17 -36Z M-10 -38 Q-10 -27 0 -26 Q10 -27 10 -38 Q10 -49 0 -49 Q-10 -49 -10 -38Z" fill="#1F3A5F" fill-rule="evenodd"/><path d="M-18 0 L-46 -30" stroke="#0B6E6E" stroke-width="8" stroke-linecap="round"/></g><text x="405" y="248" text-anchor="middle" font-family="IBM Plex Sans Arabic,Tahoma" font-size="12" font-weight="700" fill="#1F3A5F">المعلّمة</text></svg>`;
 return s;}
function bindPlayer(el){
 stopVideo();const SC=M.scenes,P=prog(M.id);
 const scr=el.querySelector('#scr'),cap=el.querySelector('#cap'),segs=el.querySelector('#segs'),did=el.querySelector('#did'),playB=el.querySelector('#vPlay'),voiceB=el.querySelector('#vVoice');
 vState={i:0,li:0,playing:false,voice:vState?vState.voice:false,to:null,ti:null,timerLeft:null};
 voiceB.textContent=vState.voice?'🔊 الصوت':'🔈 الصوت';
 segs.innerHTML=SC.map((s,i)=>`<b data-s="${i}" title="${esc(s.t)}"></b>`).join('');
 const voiceAr=()=>{try{return speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang));}catch(e){return null;}};
 function draw(){const sc=SC[vState.i],ln=sc.lines[vState.li]||sc.lines[0];
  scr.innerHTML=stageSVG(sc,vState.li)+`<div class="scene-t">${vState.i+1}/${SC.length} · ${esc(sc.t)}</div>`+(sc.timer&&vState.timerLeft!=null?`<svg class="timer" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="#10222b" opacity=".85"/><circle cx="30" cy="30" r="25" fill="none" stroke="#F0C75E" stroke-width="5" stroke-dasharray="${157*vState.timerLeft/sc.timer} 157" transform="rotate(-90 30 30)"/><text x="30" y="37" text-anchor="middle" fill="#fff" font-size="20" font-family="Reem Kufi">${vState.timerLeft}</text></svg>`:'');
  cap.innerHTML=`<span class="who">${NAMES[ln[0]]}</span>${esc(ln[1])}`;
  [...segs.children].forEach((b,i)=>b.className=i<vState.i?'on':i===vState.i?'cur':'');
  did.innerHTML=`<div style="background:var(--teal-soft)"><b style="color:var(--teal)">ماذا تفعل المعلّمة؟</b><br>${esc(sc.did[0])}</div><div style="background:var(--coral-soft)"><b style="color:var(--coral)">ماذا تفعل الطالبات؟</b><br>${esc(sc.did[1])}</div>`;
  playB.textContent=vState.playing?'❚❚ إيقاف':'▶ تشغيل';}
 function finish(){vState.playing=false;P.video=true;save();draw();}
 function step(){if(!vState.playing||!scr.isConnected)return;const sc=SC[vState.i],ln=sc.lines[vState.li];
  const next=()=>{if(!vState.playing)return;vState.li++;if(vState.li>=sc.lines.length){if(sc.timer&&vState.timerLeft==null){runTimer();return;}vState.li=0;vState.timerLeft=null;vState.i++;if(vState.i>=SC.length){vState.i=SC.length-1;vState.li=sc.lines.length-1;finish();return;}}draw();step();};
  if(vState.voice&&'speechSynthesis' in window){try{const u=new SpeechSynthesisUtterance(ln[1]);u.lang='ar-SA';const v=voiceAr();if(v)u.voice=v;u.rate=.95;let dn=false;const fin=()=>{if(dn)return;dn=true;clearTimeout(vState.to);vState.to=setTimeout(next,450);};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);vState.to=setTimeout(fin,Math.max(4000,ln[1].length*140));return;}catch(e){}}
  vState.to=setTimeout(next,Math.max(2800,ln[1].length*68));}
 function runTimer(){const sc=SC[vState.i];vState.timerLeft=sc.timer;draw();vState.ti=setInterval(()=>{if(!scr.isConnected){clearInterval(vState.ti);return;}vState.timerLeft--;draw();if(vState.timerLeft<=0){clearInterval(vState.ti);vState.timerLeft=null;vState.li=0;vState.i++;draw();step();}},1000);}
 function go(i){stopVideo();vState.i=Math.max(0,Math.min(SC.length-1,i));vState.li=0;vState.timerLeft=null;draw();}
 playB.onclick=()=>{if(vState.playing){stopVideo();draw();return;}if(vState.i===SC.length-1&&vState.li>=SC[vState.i].lines.length-1){vState.i=0;vState.li=0;}vState.playing=true;draw();step();};
 el.querySelector('#vPrev').onclick=()=>go(vState.i-1);
 el.querySelector('#vNext').onclick=()=>{go(vState.i+1);if(vState.i===SC.length-1){P.video=true;save();}};
 segs.onclick=e=>{const b=e.target.closest('[data-s]');if(b)go(+b.dataset.s);};
 voiceB.onclick=()=>{vState.voice=!vState.voice;voiceB.setAttribute('aria-pressed',vState.voice);voiceB.textContent=vState.voice?'🔊 الصوت':'🔈 الصوت';
  if(vState.voice){try{speechSynthesis.getVoices();setTimeout(()=>{if(!voiceAr())el.querySelector('#vNote').textContent='لم يُعثر على صوت عربي في هذا المتصفح؛ ستُقرأ الجمل بصوت المتصفح الافتراضي إن وُجد، والترجمة النصية تعمل دائماً.';},500);}catch(e){}}else{try{speechSynthesis.cancel();}catch(e){}}};
 draw();}

/* ----- library pages ----- */
function libPages(){const L=[];
 L.push({sec:'المكتبة',html:()=>`<div class="titlepg"><div class="orn">❁ ❁ ❁</div><div class="eyebrow">الكتاب التفاعلي</div><h1>طرائق تدريس التربية الإسلامية</h1>
 <p style="color:var(--muted)">د. منيرة الرشيدي · عضو هيئة التدريس في قسم الدراسات الإسلامية<br>الجامعة الإسلامية بمنيسوتا (IUM)</p>
 <div class="lv"><span style="background:var(--teal)">أتعلّم</span><span style="background:var(--navy)">أشاهد</span><span style="background:var(--coral)">أنتج بـ Claude</span><span style="background:var(--gold)">أختبر</span></div>
 <div class="box gold" style="text-align:start;margin-inline:auto;max-width:460px"><b class="k">كيف تستخدمين الكتاب؟</b>اختاري طريقة تدريس من رفّ المكتبة في الصفحة المقابلة. في كل طريقة: تتعلّمين الطريقة، وتشاهدين درساً يطبّقها، ثم تصنعين نشاطاً إلكترونياً بنفسك مع Claude. يُحفظ تقدّمك على هذا الجهاز.</div></div>`});
 L.push({sec:'المكتبة',html:()=>{const avail=PLAN.filter(p=>byId(p[0])).length;
  return `<div class="eyebrow">رفّ المكتبة</div><h2>اختاري طريقة التدريس</h2><div class="shelf">${[7,8,9].map(u=>`<div><h3>${UNITN[u]}</h3><div class="spines">${PLAN.filter(p=>p[2]===u).map(p=>{const m=byId(p[0]);return `<button class="spine" style="background:${p[3]}" ${m?`data-open="${p[0]}"`:'disabled'} aria-label="${p[1]}${m?'':' (قريباً)'}"><span class="nm">${p[1]}</span><span class="pc">${m?pctOf(m)+'%':'قريباً'}</span></button>`;}).join('')}</div></div>`).join('')}
  <p class="legend">متاح الآن ${avail} من ${PLAN.length} طرق. الكعوب الباهتة تُضاف تباعاً.</p></div>`;},
  bind:el=>el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMethod(b.dataset.open))});
 return L;}

/* ----- method pages ----- */
function methodPages(m){const P=prog(m.id),L=[];const pg=(sec,html,bind)=>L.push({sec,html,bind});
 pg('',()=>`<div class="titlepg"><div class="orn">❁ ❁ ❁</div><div class="eyebrow">${UNITN[m.unit]}</div><h1 style="color:${m.color}">${m.name}</h1>
  <p style="color:var(--muted)">من الكتاب التفاعلي «طرائق تدريس التربية الإسلامية» — د. منيرة الرشيدي</p>
  <div class="lv"><span style="background:var(--teal)">أتعلّم</span><span style="background:var(--navy)">أشاهد</span><span style="background:var(--coral)">أنتج بـ Claude</span><span style="background:var(--gold)">أختبر</span></div>
  <div class="row" style="justify-content:center"><button class="btn ghost sm" data-lib>↩ العودة إلى المكتبة</button></div></div>`,el=>el.querySelector('[data-lib]').onclick=()=>openLibrary());
 pg('تقدّمي',()=>{const ms=milestones(m),v=pctOf(m),C=2*Math.PI*46;
  const b=[['📖','قارئة',ms[0].d],['🎬','مُشاهِدة',ms[1].d],['🧪','مجرّبة',ms[2].d],['🛠️','صانعة',ms[3].d],['🏅','متقِنة',P.quiz!=null&&P.quiz>=5],['🚀','مبادِرة',ms[5].d]];
  return `<div class="eyebrow">لوحة الطالبة</div><h2>تقدّمي في ${m.name}</h2>
  <div class="row" style="gap:16px;align-items:center"><svg class="ring" viewBox="0 0 110 110" role="img" aria-label="نسبة الإنجاز ${v}%"><circle cx="55" cy="55" r="46" fill="none" stroke="var(--line)" stroke-width="11"/><circle cx="55" cy="55" r="46" fill="none" stroke="var(--gold)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 55 55)"/><text x="55" y="62" text-anchor="middle" font-size="24" font-family="Reem Kufi" fill="var(--teal)">${v}%</text></svg>
  <div style="flex:1;min-width:180px"><div class="row"><span class="tag">الاختبار: ${P.quiz==null?'لم يُحَل بعد':P.quiz+' / 6'}</span></div><ul class="ms">${ms.map(x=>`<li class="${x.d?'done':''}"><i>${x.d?'✓':''}</i>${x.t}</li>`).join('')}</ul></div></div>
  <h3>الشارات</h3><div class="badges">${b.map(x=>`<div class="badge ${x[2]?'on':''}"><div class="md">${x[0]}</div>${x[1]}</div>`).join('')}</div>
  <h3>محتويات الطريقة</h3><div class="toc">${[['أتعلّم: التعريف والأهداف',2],['أتعلّم: الخطوات والأدوار',3],['أتعلّم: '+m.learn3.title,4],['أتعلّم: أمثلة للمراحل الثلاث',5],['أشاهد: '+m.lesson.replace('درس تطبيقي: ',''),6],['أنتج: '+m.produceTitle,8],['جرّبي: '+m.sample.title,9],['المختبر: مولّد البرومبت',11],['أختبر: اختبار قصير',12],['المهمة ومعايير التقييم',13]].map(x=>`<button data-go="${x[1]}"><span>${esc(x[0])}</span><span>ص ${x[1]+1}</span></button>`).join('')}</div>`;},
  el=>el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>goTo(+b.dataset.go)));
 pg('أتعلّم',()=>`<div class="eyebrow">أتعلّم · 1 من 4</div><h2>${m.name}${m.alt?` <span style="font-size:15px;color:var(--muted)">(${m.alt})</span>`:''}</h2>
  <div class="box"><b class="k">التعريف</b>${m.def}</div><h3>من القرآن والسنة</h3>${m.evidence}
  <h3>أهداف الطريقة</h3><ul>${m.aims.map(a=>`<li>${a}</li>`).join('')}</ul>
  <h3>مميزاتها</h3><div class="grid2">${m.merits.map(x=>`<div class="card"><h4>${x[0]}</h4>${x[1]}</div>`).join('')}</div>`);
 pg('أتعلّم',()=>`<div class="eyebrow">أتعلّم · 2 من 4</div><h2>خطوات التنفيذ والأدوار</h2>
  <ol class="steps">${m.steps.map(s=>`<li><b>${s[0]}:</b> ${s[1]}</li>`).join('')}</ol>
  <div class="grid2"><div class="card" style="border-color:var(--teal)"><h4 style="color:var(--teal)">دور المعلّم</h4><ul>${m.teacher.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card" style="border-color:var(--coral)"><h4 style="color:var(--coral)">دور المتعلّم</h4><ul>${m.learner.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`);
 pg('أتعلّم',()=>`<div class="eyebrow">أتعلّم · 3 من 4</div><h2>${m.learn3.title}</h2>${m.learn3.html}<div class="box coral"><b class="k">تنبيه</b>${m.caution}</div>`);
 pg('أتعلّم',()=>`<div class="eyebrow">أتعلّم · 4 من 4</div><h2>${m.stages.title}</h2>

 if(Math.abs(t-cur)===(mode==='spread'?2:1)){turn(dir);return;}cur=t;render();}
function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search);}catch(e){try{location.hash=h;}catch(_){}}}
function openMethod(id){const m=byId(id);if(!m)return;stopVideo();M=m;pages=methodPages(m);cur=0;chips();render();setHash(id);}
function openLibrary(){stopVideo();M=null;pages=libPages();cur=mode==='spread'?0:1;chips();render();setHash('');}
document.getElementById('chips').onclick=e=>{const b=e.target.closest('[data-go]');if(b)goTo(+b.dataset.go);};
document.getElementById('prevB').onclick=()=>turn(-1);
document.getElementById('nextB').onclick=()=>turn(1);
document.addEventListener('keydown',e=>{if(/input|textarea|select/i.test(e.target.tagName))return;if(e.key==='ArrowLeft')turn(1);if(e.key==='ArrowRight')turn(-1);});
let tx=null,ty=null;spread.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
spread.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){if(e.target.closest('.game,.player,.dboard,.sbook,.sim,input,select,textarea,.prompt,.tbl'))return;turn(dx>0?1:-1);}},{passive:true});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const m=mode;calcMode();if(m!==mode)render();},150);});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&byId(h)&&(!M||M.id!==h))openMethod(h);});
calcMode();
const h0=location.hash.slice(1);if(h0&&byId(h0))openMethod(h0);else openLibrary();
